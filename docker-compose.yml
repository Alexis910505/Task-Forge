# Postgres TaskForge en el host en 5433 (5432 suele estar ocupado por otro stack).
# Dentro de Docker la API sigue usando postgres:5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: taskforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
    ports:
      - "5433:5432"
    volumes:
      - taskforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskforge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://taskforge:taskforge@postgres:5432/taskforge?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars!}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"

volumes:
  taskforge_pgdata:
