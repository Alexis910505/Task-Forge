# API NestJS en Render (plan gratuito). BD y archivos: Neon (misma zona, us-east-2).
services:
  - type: web
    name: taskforge-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Despliega solo cuando pasan los checks de GitHub Actions (.github/workflows/ci-deploy.yml)
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_SIGNUP
        value: "false"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-2
      - key: S3_BUCKET
        value: taskforge-uploads
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
