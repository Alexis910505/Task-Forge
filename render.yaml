# API NestJS en Render (plan gratuito). BD y archivos: Neon (misma zona, us-east-2).
services:
  - type: web
    name: taskforge-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Despliega solo cuando pasan los checks de GitHub Actions (.github/workflows/ci-deploy.yml)
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_SIGNUP
        value: "false"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-2
      - key: S3_BUCKET
        value: taskforge-uploads
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # URLs públicas (enlaces de invitación y vuelta desde Microsoft)
      - key: PUBLIC_API_URL
        value: https://taskforge-api-rolx.onrender.com
      - key: WEB_APP_URL
        value: https://taskforge-ops.web.app
      # «Entrar con Microsoft» (opcional: sin estas dos variables el botón no aparece)
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_TENANT
        value: common
      # Correos de invitación por Brevo (opcional: sin clave, el enlace se copia a mano)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Task Forge
