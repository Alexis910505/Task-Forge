<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#e1dfff",
                    "outline-variant": "#c7c4d8",
                    "tertiary-fixed-dim": "#4ae176",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#005321",
                    "primary-fixed-dim": "#c1c1ff",
                    "surface-container-high": "#e2e7ff",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#09006b",
                    "surface-bright": "#faf8ff",
                    "inverse-surface": "#283044",
                    "surface-container-lowest": "#ffffff",
                    "on-surface-variant": "#464555",
                    "on-secondary": "#ffffff",
                    "surface-tint": "#4745e5",
                    "surface-container-highest": "#dae2fd",
                    "on-error-container": "#93000a",
                    "surface": "#faf8ff",
                    "surface-container-low": "#f2f3ff",
                    "on-surface": "#131b2e",
                    "tertiary": "#006d2e",
                    "secondary": "#515f74",
                    "surface-dim": "#d2d9f4",
                    "on-primary-fixed-variant": "#2c24ce",
                    "background": "#faf8ff",
                    "surface-variant": "#dae2fd",
                    "surface-container": "#eaedff",
                    "secondary-container": "#d5e3fc",
                    "on-primary-container": "#ffffff",
                    "on-secondary-fixed-variant": "#3a485b",
                    "inverse-primary": "#c1c1ff",
                    "tertiary-fixed": "#6bff8f",
                    "secondary-fixed-dim": "#b9c7df",
                    "secondary-fixed": "#d5e3fc",
                    "error": "#ba1a1a",
                    "primary-container": "#6161ff",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#0d1c2e",
                    "on-secondary-container": "#57657a",
                    "primary": "#4744e5",
                    "on-tertiary-fixed": "#002109",
                    "on-tertiary-container": "#ffffff",
                    "outline": "#767587",
                    "error-container": "#ffdad6",
                    "tertiary-container": "#00893c",
                    "on-background": "#131b2e",
                    "inverse-on-surface": "#eef0ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sidebar-width": "260px",
                    "gutter": "1.5rem",
                    "space-6": "1.5rem",
                    "space-8": "2rem",
                    "container-max": "1440px",
                    "space-1": "0.25rem",
                    "base": "4px",
                    "space-4": "1rem",
                    "space-2": "0.5rem"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "mono-label": ["Inter"],
                    "headline-lg": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-bold": ["Inter"],
                    "title-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "mono-label": ["13px", {"lineHeight": "18px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .one-hand-optimized { padding-bottom: 180px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background selection:bg-primary-fixed">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 right-0 h-16 bg-surface dark:bg-surface-dim z-30 flex items-center justify-between px-gutter border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-surface-container-high transition-all active:opacity-80">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">New Task</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant">cloud_off</span>
<span class="font-label-bold text-label-bold text-on-surface-variant">OFFLINE</span>
</div>
</header>
<main class="pt-20 px-gutter max-w-md mx-auto one-hand-optimized">
<form class="space-y-space-6">
<!-- Task Title Section -->
<div class="space-y-space-2">
<label class="font-label-bold text-label-bold text-outline uppercase">Task Title</label>
<input class="w-full h-14 px-4 bg-surface-container-low border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-body-lg font-body-lg transition-all rounded-t-lg" placeholder="e.g. Inspect Generator B-12" type="text"/>
</div>
<!-- Category Chips (One-handed horizontal scroll) -->
<div class="space-y-space-2">
<label class="font-label-bold text-label-bold text-outline uppercase">Category</label>
<div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
<button class="flex-shrink-0 px-6 py-3 rounded-full bg-primary text-on-primary font-label-bold text-label-bold border border-primary" type="button">Maintenance</button>
<button class="flex-shrink-0 px-6 py-3 rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-bold text-label-bold" type="button">Repair</button>
<button class="flex-shrink-0 px-6 py-3 rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-bold text-label-bold" type="button">Safety</button>
<button class="flex-shrink-0 px-6 py-3 rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-bold text-label-bold" type="button">Audit</button>
</div>
</div>
<!-- Asset Selection -->
<div class="space-y-space-2">
<label class="font-label-bold text-label-bold text-outline uppercase">Asset Selection</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-4 text-on-surface-variant">search</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-body-lg font-body-lg transition-all rounded-t-lg" placeholder="Search equipment or site..." type="text"/>
</div>
<div class="flex flex-col gap-2 pt-2">
<div class="flex items-center gap-3 p-3 bg-surface-container-high/50 rounded-xl border border-outline-variant/30">
<div class="w-10 h-10 rounded-lg bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container">precision_manufacturing</span>
</div>
<div class="flex-1">
<p class="font-body-lg text-body-lg text-on-surface">HVAC Unit #402</p>
<p class="font-label-bold text-label-bold text-on-surface-variant">Floor 4, East Wing</p>
</div>
<span class="material-symbols-outlined text-primary">check_circle</span>
</div>
</div>
</div>
<!-- Priority Selection (Large touch targets) -->
<div class="space-y-space-2">
<label class="font-label-bold text-label-bold text-outline uppercase">Priority</label>
<div class="grid grid-cols-3 gap-2">
<button class="h-16 flex flex-col items-center justify-center rounded-xl bg-surface-container-low border border-outline-variant text-on-surface-variant hover:bg-surface-container-high transition-all" type="button">
<span class="material-symbols-outlined">low_priority</span>
<span class="font-label-bold text-label-bold">Low</span>
</button>
<button class="h-16 flex flex-col items-center justify-center rounded-xl bg-tertiary-container/10 border-2 border-tertiary text-tertiary transition-all" type="button">
<span class="material-symbols-outlined">priority_high</span>
<span class="font-label-bold text-label-bold">Medium</span>
</button>
<button class="h-16 flex flex-col items-center justify-center rounded-xl bg-surface-container-low border border-outline-variant text-on-surface-variant hover:bg-surface-container-high transition-all" type="button">
<span class="material-symbols-outlined">warning</span>
<span class="font-label-bold text-label-bold">Urgent</span>
</button>
</div>
</div>
<!-- Evidence Section -->
<div class="space-y-space-2 pt-4">
<label class="font-label-bold text-label-bold text-outline uppercase">Photo Evidence</label>
<button class="w-full h-32 border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center gap-2 hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-150" type="button">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl">add_a_photo</span>
</div>
<span class="font-label-bold text-label-bold text-primary">Add Photo Evidence</span>
</button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant/60">Upload up to 4 high-resolution images</p>
</div>
</form>
</main>
<!-- Bottom Action Container (Fixed for thumb access) -->
<footer class="fixed bottom-0 left-0 right-0 bg-surface border-t border-outline-variant p-gutter space-y-4 shadow-sm">
<div class="flex items-center justify-center gap-2 text-on-surface-variant/80">
<span class="material-symbols-outlined text-[18px]">wifi_off</span>
<p class="font-label-bold text-label-bold">Working Offline: Task will sync when connected</p>
</div>
<button class="w-full h-14 bg-primary text-on-primary font-title-md text-title-md rounded-xl shadow-lg active:scale-95 duration-200 flex items-center justify-center gap-2" type="submit">
<span>Save Task</span>
<span class="material-symbols-outlined">save</span>
</button>
</footer>
<!-- Offline Visual Indicator (Subtle float) -->
<div class="fixed top-20 right-4 p-2 bg-inverse-surface text-inverse-on-surface rounded-full shadow-lg opacity-90 md:hidden pointer-events-none">
<span class="material-symbols-outlined text-[20px]">cloud_off</span>
</div>
</body></html>
