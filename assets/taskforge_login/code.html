<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-space-8 md:p-10 flex flex-col items-center">

</div>

<div class="space-y-space-2">
<label class="block font-label-bold text-label-bold text-on-surface-variant" for="email">EMAIL ADDRESS</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-space-2">
<div class="flex justify-between items-center">
<label class="block font-label-bold text-label-bold text-on-surface-variant" for="password">PASSWORD</label>
<a class="font-label-bold text-label-bold text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-space-2">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-label-bold text-label-bold uppercase tracking-widest hover:bg-primary-container active:scale-[0.98] transition-all shadow-sm" type="submit">
                        Sign In
                    </button>
</div>
</form>
<div class="mt-space-8 w-full">
<div class="relative flex items-center mb-space-6">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-bold text-label-bold text-outline">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<div class="grid grid-cols-2 gap-space-4">
<button class="flex items-center justify-center gap-space-2 px-4 py-2 border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface hover:bg-surface-container-low transition-colors">

</div>

<div class="mt-space-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-bold text-label-bold text-primary hover:text-primary-container" href="#">Contact Admin</a>
</p>
</div>
</div>

<a class="font-label-bold text-label-bold text-on-surface-variant hover:text-on-surface" href="#">Privacy Policy</a>
